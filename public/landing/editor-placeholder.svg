<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>Illustrative Eton Note editor</title>
  <desc>A replaceable editor preview, showing a physics note, block tools, and a note outline. This is an illustration, not a product screenshot.</desc>
  <rect width="1600" height="1000" fill="#f3f4f6"/>
  <rect width="1600" height="76" fill="#ffffff"/>
  <rect y="76" width="234" height="924" fill="#ffffff"/>
  <rect x="1380" y="76" width="220" height="924" fill="#ffffff"/>
  <path d="M0 76H1600M234 76V1000M1380 76V1000" stroke="#e5e7eb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f1115">
    <text x="28" y="48" font-size="23" font-weight="700">Eton Note</text>
    <text x="277" y="46" font-size="16" fill="#475569">Physics / Newton’s laws of motion</text>
    <rect x="810" y="20" width="278" height="36" rx="6" fill="#f3f4f6"/>
    <text x="830" y="43" font-size="14" fill="#6b7280">Search blocks…</text>
    <text x="1190" y="46" font-size="15" fill="#475569">Preview</text>
    <rect x="1400" y="17" width="172" height="42" rx="6" fill="#c78316"/>
    <text x="1486" y="44" text-anchor="middle" font-size="15" font-weight="600">Export PDF</text>

    <text x="28" y="132" font-size="15" font-weight="700">Block tools</text>
    <g font-size="16" fill="#475569">
      <rect x="16" y="157" width="202" height="44" rx="6" fill="#fceccb"/>
      <text x="30" y="185" fill="#0f1115">General block</text>
      <text x="30" y="233">Heading</text>
      <text x="30" y="281">Formula</text>
      <text x="30" y="329">Table</text>
      <text x="30" y="377">Code</text>
      <text x="30" y="425">Image</text>
      <text x="30" y="473">Drawing</text>
      <text x="30" y="521">Divider</text>
    </g>
    <rect x="24" y="563" width="186" height="44" rx="6" fill="#c78316"/>
    <text x="117" y="591" text-anchor="middle" font-size="15" font-weight="600">Generate with AI</text>
    <path d="M24 831H210" stroke="#e5e7eb"/>
    <text x="28" y="868" font-size="15" font-weight="700">Physics</text>
    <text x="28" y="905" font-size="14" fill="#475569">Newton’s laws</text>
    <text x="28" y="940" font-size="14" fill="#6b7280">Energy &amp; work</text>

    <rect x="310" y="123" width="994" height="817" fill="#ffffff"/>
    <text x="354" y="194" font-size="34" font-weight="700" letter-spacing="-1">Newton’s laws of motion</text>
    <text x="354" y="231" font-size="16" fill="#6b7280">Physics / Mechanics</text>
    <rect x="354" y="271" width="906" height="121" rx="7" fill="#fceccb"/>
    <text x="378" y="309" font-size="18" font-weight="700">Definition</text>
    <text x="378" y="342" font-size="19">An object’s motion changes when a net force acts on it.</text>
    <text x="378" y="370" font-size="19">The same force produces less acceleration in a heavier object.</text>
    <rect x="354" y="424" width="906" height="134" rx="7" fill="#f3f4f6"/>
    <text x="807" y="493" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-style="italic">F<tspan font-size="22" baseline-shift="sub">net</tspan><tspan baseline-shift="baseline"> = ma</tspan></text>
    <text x="807" y="531" text-anchor="middle" font-size="16" fill="#475569">Force (N) = mass (kg) × acceleration (m/s²)</text>
    <text x="354" y="612" font-size="23" font-weight="700">Worked example</text>
    <text x="354" y="650" font-size="19">A 2 kg object experiences a net force of 10 N.</text>
    <text x="354" y="689" font-family="Georgia, serif" font-size="26">a = F<tspan font-size="15" baseline-shift="sub">net</tspan><tspan baseline-shift="baseline"> / m = 5 m/s²</tspan></text>
    <rect x="432" y="742" width="132" height="74" rx="3" fill="#ffffff" stroke="#0f1115" stroke-width="2"/>
    <text x="498" y="787" text-anchor="middle" font-size="20">2 kg</text>
    <path d="M564 779H1045M1031 767L1045 779L1031 791" fill="none" stroke="#c78316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="805" y="753" text-anchor="middle" font-size="18">10 N</text>
    <text x="354" y="887" font-size="16" fill="#6b7280">One note, with each idea in its own block.</text>

    <text x="1408" y="128" font-size="15" font-weight="700">In this note</text>
    <g font-size="14" fill="#475569">
      <text x="1408" y="176">Definition</text>
      <text x="1408" y="216">Main formula</text>
      <text x="1408" y="256">Worked example</text>
      <text x="1408" y="296">Quick comparison</text>
    </g>
  </g>
</svg>
